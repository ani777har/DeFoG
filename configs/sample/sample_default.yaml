# balanced rate matrice settings
eta: 0.
omega: 0.

# generation settings
sample_steps: 50
time_distortion: "identity"     # 'identity', 'cosine', polyinc, polydec, derived

# 'derived' time distortion
derived_distortion_curve: null
derived_distortion_signal: soft_combined  # column of decoding_error.csv to build tau from
                                          # ('soft_combined' | 'pe_combined' | 'ce_combined';
                                          #  pe_* saturates at 2 edge classes -- it is exactly
                                          #  flat below t~0.33 on planar, so tau is not invertible there)
search: False           # 'all' | 'target_guidance' | 'distortion' | 'stochasticity' | 'full_grid' | 'random' | 'bo' | 'sobol' | 'fixed_configs' | False



search_configs_csv: null  # CSV of fixed sampling configs (time_distortion, eta, omega) for search: 'fixed_configs'

# --- decoding error curve P_e(t) ---------------------------------------------

measure_decoding_error: False
decoding_error_n_times: 51      # grid points on [0,1]; these are probes, not steps
decoding_error_n_draws: 8       # independent corruptions per graph per t
decoding_error_coupled: True    # reuse one noise draw across the whole t grid
                                # (nested reveals -> far less jitter in the curve)
decoding_error_split: val       # val | test | train -- keep off test
decoding_error_max_graphs: null # cap the number of graphs; null uses the split
decoding_error_seed: 0

# --- trajectory probes (Phase 2) ---------------------------------------------
probe_trajectory: False
probe_spectral: True          # largest/smallest adjacency eigenvalue (one eigvalsh per step)
probe_validity_every: 0       # >0: every k steps, run the dataset validity check on argmax(pred_E)
probe_validity_max_graphs: 8  # graphs per batch to check (CPU-side, keep small)

# shared across the 'random', 'bo' and 'sobol' searches
search_n_trials: 140   # total trials per num_step
search_seed: 21 # anishok defaulty 42 er

search_random_eta_range: [0.0, 100.0]
search_random_omega_range: [0.0, 0.5]
search_random_omega_root: 1.0  # omega = lo + (hi-lo)*(1 - u**root); <1 concentrates draws near lo (0), 1.0 = no transform (uniform)


search_bo_sampler: tpe   # 'gp' | 'tpe' | 'hebo'  (hebo needs: pip install optunahub hebo pymoo)
search_bo_n_startup_trials: 10  # 'gp'/'tpe' only; hebo manages its own initial design
search_bo_objective: average_ratio  # BO objective: 'average_ratio' (minimized) | 'vun' (maximized) | 'both' (multi-objective Pareto search; 'gp'/'tpe'/'hebo')
search_bo_visualize: True

search_bo_resume_from: null  # e.g. outputs/2026-07-15/14-45-11-sbm-sbm


# fixed
rdb: 'general'            # general | column | entry
rdb_crit: dummy           # max_marginal | x_t | p_x1_g_xt | x_1 | p_xt_g_x1 | p_xtdt_g_xt | x_0 | xhat_t
                          # abs_state
