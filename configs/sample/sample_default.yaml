# balanced rate matrice settings
eta: 0.
omega: 0.

# generation settings
sample_steps: 1000
time_distortion: "identity"     # 'identity', 'cosine', polyinc, polydec
search: False           # 'all' | 'target_guidance' | 'distortion' | 'stochasticity' | 'full_grid' | 'random' | 'bo' | 'sobol' | 'fixed_configs' | False



search_configs_csv: null  # CSV of fixed sampling configs (time_distortion, eta, omega) for search: 'fixed_configs'

# shared across the 'random', 'bo' and 'sobol' searches
search_n_trials: 140   # total trials per num_step
search_seed: 42

search_random_eta_range: [0.0, 25.0]
search_random_omega_range: [0.0, 0.5]
search_random_omega_root: 0.2  # omega = lo + (hi-lo)*(1 - u**root); <1 concentrates draws near lo (0)


search_bo_sampler: tpe   # 'gp' | 'tpe'
search_bo_n_startup_trials: 10
search_bo_objective: average_ratio  # BO objective: 'average_ratio' (minimized) | 'vun' (maximized) | 'both' (multi-objective Pareto search; 'gp'/'tpe' only)
search_bo_visualize: True

search_bo_resume_from: null  # e.g. outputs/2026-07-15/14-45-11-sbm-sbm


# fixed
rdb: 'general'            # general | column | entry
rdb_crit: dummy           # max_marginal | x_t | p_x1_g_xt | x_1 | p_xt_g_x1 | p_xtdt_g_xt | x_0 | xhat_t
                          # abs_state
